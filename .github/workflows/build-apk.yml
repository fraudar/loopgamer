name: Build LoopGamer Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Create missing platform scaffolding if needed
        run: |
          flutter create --platforms=android --org org.loopgamer .
          flutter pub get

      - name: Build Release APK (Libretro JNI + Flutter)
        run: |
          flutter build apk --release \
            --dart-define=IGDB_CLIENT_ID=${{ secrets.IGDB_CLIENT_ID }} \
            --dart-define=IGDB_CLIENT_SECRET=${{ secrets.IGDB_CLIENT_SECRET }} \
            --dart-define=SGDB_API_KEY=${{ secrets.SGDB_API_KEY }}

      - name: Upload LoopGamer APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: loopgamer-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
